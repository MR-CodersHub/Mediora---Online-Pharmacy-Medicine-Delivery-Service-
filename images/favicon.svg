<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favMedioraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087653"/>
      <stop offset="60%" stop-color="#075B45"/>
      <stop offset="100%" stop-color="#054635"/>
    </linearGradient>
    <linearGradient id="favMedioraMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="favGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#favMedioraBg)"/>
  <!-- Top Glass Sheen -->
  <rect x="3" y="3" width="58" height="28" rx="14" fill="url(#favGlass)"/>
  <!-- Inner Border Ring -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="1.8"/>

  <!-- Medical Cross -->
  <rect x="15" y="27" width="34" height="10" rx="5" fill="#FFFFFF"/>
  <rect x="27" y="15" width="10" height="34" rx="5" fill="#FFFFFF"/>

  <!-- Center Accent Jewel -->
  <circle cx="32" cy="32" r="4.2" fill="url(#favMedioraMint)"/>

  <!-- Vitality Leaf Curve (Top Right Accent) -->
